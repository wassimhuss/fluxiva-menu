services:
  - type: web
    name: fluxiva-menu
    runtime: static
    buildCommand: COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm@10.18.3 install --frozen-lockfile --registry=https://registry.npmjs.org --store-dir /tmp/pnpm-store && COREPACK_ENABLE_PROJECT_SPEC=0 corepack pnpm@10.18.3 run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_APP_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
