<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Beautiful bilingual QR menus for Lebanese restaurants." />
    <title>Fluxiva Menu</title>

    <!--
      Warm up the origin that serves both the menu data and every photo on it.
      A QR scan is usually a cold connection on mobile data, so paying for DNS,
      TCP and TLS here rather than at first fetch is worth real time.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!--
      Loaded here rather than via `@import` in the stylesheet: an @import cannot
      begin until the stylesheet that contains it has downloaded and parsed, so
      the fonts queue behind the CSS instead of fetching alongside it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Tajawal:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
